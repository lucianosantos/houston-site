name = "houston-site"
main = "worker/index.mjs"
compatibility_date = "2026-10-22"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/game/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[[r2_buckets]]
binding = "GAME_BUCKET"
bucket_name = "firefly-houston"
